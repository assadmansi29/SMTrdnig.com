<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold border gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131A2A" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Gold text gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle inner gold ambient glow -->
    <radialGradient id="ambientGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E131F" stop-opacity="0" />
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer background rounded square with gold border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="112"
    ry="112"
    fill="url(#darkBg)"
    stroke="url(#goldBorder)"
    stroke-width="24"
    filter="url(#goldGlow)"
  />

  <!-- Subtle ambient inner glow -->
  <rect
    x="36"
    y="36"
    width="440"
    height="440"
    rx="100"
    ry="100"
    fill="url(#ambientGlow)"
  />

  <!-- Inner delicate hairline border -->
  <rect
    x="48"
    y="48"
    width="416"
    height="416"
    rx="88"
    ry="88"
    fill="none"
    stroke="#FBBF24"
    stroke-width="2"
    stroke-opacity="0.4"
  />

  <!-- SM Monogram Logo Text -->
  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Plus Jakarta Sans', 'Cinzel', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="228"
    font-weight="900"
    letter-spacing="-8"
    fill="url(#goldText)"
  >SM</text>
</svg>
