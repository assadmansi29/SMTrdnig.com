    <script>
      // Early suppression of third-party cross-origin iframe / embed script errors
      window.onerror = function(msg, url, line, col, error) {
        if (msg === 'Script error.' || (url && url.indexOf('tradingview') !== -1) || !url) {
          return true; // suppress error reporting to window
        }
        return false;
      };
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || (event.filename && event.filename.indexOf('tradingview') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).indexOf('Script error') !== -1 || String(event.reason).indexOf('tradingview') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
