<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="50%" stop-color="#F0F2F5"/>
      <stop offset="100%" stop-color="#E2E6EA"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3B28A"/>
      <stop offset="50%" stop-color="#D19B72"/>
      <stop offset="100%" stop-color="#BD855D"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303642"/>
      <stop offset="50%" stop-color="#232832"/>
      <stop offset="100%" stop-color="#181C24"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221F20"/>
      <stop offset="100%" stop-color="#111112"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  
  <!-- Ambient Soft Studio Glow behind subject -->
  <circle cx="400" cy="420" r="280" fill="#FFFFFF" opacity="0.7"/>

  <g filter="url(#shadow)">
    <!-- Torso & Suit -->
    <!-- Shoulders / Jacket Base -->
    <path d="M120 1000 L180 560 L280 480 L350 480 L400 620 L450 480 L520 480 L620 560 L680 1000 Z" fill="url(#suit)"/>
    
    <!-- Windowpane Plaid Grid Pattern on Suit -->
    <path d="M150 650 L650 650 M140 750 L660 750 M130 850 L670 850 M125 950 L675 950" stroke="#3D4452" stroke-width="1.5" opacity="0.4"/>
    <path d="M240 500 L210 1000 M320 490 L300 1000 M480 490 L500 1000 M560 500 L590 1000" stroke="#3D4452" stroke-width="1.5" opacity="0.4"/>

    <!-- White Shirt -->
    <polygon points="340,480 460,480 420,680 380,680" fill="#FFFFFF"/>
    <!-- Shirt Collar -->
    <polygon points="340,470 385,550 375,470" fill="#F4F6F8" stroke="#E2E8F0" stroke-width="1"/>
    <polygon points="460,470 415,550 425,470" fill="#F4F6F8" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Suit Lapels -->
    <polygon points="280,480 350,480 395,680 330,680" fill="#2A303C"/>
    <polygon points="520,480 450,480 405,680 470,680" fill="#2A303C"/>
    <!-- Lapel edge highlights -->
    <line x1="350" y1="480" x2="395" y2="680" stroke="#475163" stroke-width="2"/>
    <line x1="450" y1="480" x2="405" y2="680" stroke="#475163" stroke-width="2"/>

    <!-- Neck & Chest -->
    <polygon points="360,430 440,430 430,520 400,540 370,520" fill="url(#skin)"/>
    <polygon points="385,510 415,510 400,535" fill="#C58F5B" opacity="0.6"/>

    <!-- Head & Face -->
    <ellipse cx="400" cy="330" rx="115" ry="145" fill="url(#skin)"/>

    <!-- Ears -->
    <ellipse cx="282" cy="335" rx="14" ry="26" fill="#D19B72"/>
    <ellipse cx="518" cy="335" rx="14" ry="26" fill="#D19B72"/>

    <!-- Hair (Short cropped executive style with neat fade) -->
    <path d="M290 320 C290 200, 510 200, 510 320 C510 230, 480 185, 400 185 C320 185, 290 230, 290 320 Z" fill="url(#hair)"/>
    <path d="M290 280 Q320 225 400 220 Q480 225 510 280 Q515 240 470 200 Q400 190 330 200 Q285 240 290 280 Z" fill="#111112"/>

    <!-- Eyebrows (Strong, masculine, arched) -->
    <path d="M330 295 Q360 285 385 292" stroke="#1F1D1D" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M470 295 Q440 285 415 292" stroke="#1F1D1D" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Warm, engaging, dark brown) -->
    <ellipse cx="358" cy="315" rx="14" ry="9" fill="#FFFFFF"/>
    <ellipse cx="442" cy="315" rx="14" ry="9" fill="#FFFFFF"/>
    <circle cx="358" cy="315" r="6.5" fill="#2B1E16"/>
    <circle cx="442" cy="315" r="6.5" fill="#2B1E16"/>
    <circle cx="360" cy="313" r="2" fill="#FFFFFF"/>
    <circle cx="444" cy="313" r="2" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M400 305 L395 365 Q400 375 408 365" stroke="#B87D50" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="390" cy="368" rx="4" ry="2.5" fill="#9C6237" opacity="0.5"/>
    <ellipse cx="410" cy="368" rx="4" ry="2.5" fill="#9C6237" opacity="0.5"/>

    <!-- Beard & Mustache (Well-groomed trimmed dark beard) -->
    <path d="M330 350 Q310 410 340 455 Q400 485 460 455 Q490 410 470 350 Q465 420 440 445 Q400 460 360 445 Q335 420 330 350 Z" fill="#1B1919"/>
    <!-- Mustache -->
    <path d="M365 385 Q400 380 435 385 Q400 405 365 385 Z" fill="#1B1919"/>
    <path d="M388 420 Q400 422 412 420 Q400 435 388 420 Z" fill="#1B1919"/>

    <!-- Warm Smiling Mouth with White Teeth -->
    <path d="M370 395 Q400 430 430 395 Z" fill="#8B263E"/>
    <path d="M374 397 Q400 412 426 397 Z" fill="#FFFFFF"/>

    <!-- Cheerful eye smile crinkles -->
    <path d="M335 315 Q340 318 335 322" stroke="#A56F45" stroke-width="1.5" fill="none"/>
    <path d="M465 315 Q460 318 465 322" stroke="#A56F45" stroke-width="1.5" fill="none"/>

    <!-- Left hand resting / luxury steel watch -->
    <path d="M510 780 L540 860 L500 890 L460 810 Z" fill="url(#suit)"/>
    <!-- Watch Bracelet & Dial -->
    <rect x="515" y="830" width="28" height="20" rx="6" fill="#CBD5E1" stroke="#64748B" stroke-width="2" transform="rotate(20 529 840)"/>
    <circle cx="529" cy="840" r="8" fill="#0F172A" stroke="#F8FAFC" stroke-width="1"/>
    <line x1="529" y1="840" x2="529" y2="835" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Verified Seal in lower corner -->
  <g transform="translate(650, 850)">
    <rect x="-40" y="-16" width="130" height="32" rx="16" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="25" y="5" fill="#FCD34D" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>
</svg>